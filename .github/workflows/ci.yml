# M0 PR gate — subset of ADR-029 (full path-aware/corpus/image-diff comes later).
# Gates: workspace build + tests + corpus-diff (qpdf oracle).
# Cites: ADR-029, ADR-022, SDS §14 M0 exit criteria.

name: ci

on:
  # ADR-029 §1 calls for a "PR pipeline (fast, path-aware)". It was not path
  # aware at all: a pull request touching only markdown ran a three-OS Rust
  # build and full test suite, which cannot be affected by it. Nothing in CI
  # reads docs/ — check-citations is not wired in, and the a11y and p95 scripts
  # read shell/ and tools/bench/*.toml — so skipping these paths cannot hide a
  # real failure. A PR touching both docs and code still runs, because
  # paths-ignore only skips when *every* changed file matches. [ADR-029 §1]
  # The two paths-ignore lists are duplicated on purpose. YAML anchors are not
  # dependably supported by the Actions parser, and a workflow that fails to
  # parse is worse than four repeated lines. Keep them in sync.
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - '.agent-state/**'
  # No base-branch filter. Restricting this to `branches: [main]` meant a PR
  # targeting any other branch received no CI at all, so stacked work merged
  # into an intermediate branch was never gated — the opposite of ADR-029 §1,
  # which gates the PR pipeline, not one destination. [ADR-029]
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - '.agent-state/**'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ADR-028 §1 requires a CI-enforced licence allowlist. Licences do not vary by
  # runner and `core/deny.toml` names every target the matrix below covers, so
  # this runs once rather than three times. [ADR-028 §1, ADR-029, DEP-1]
  licenses:
    name: licence allowlist
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # NEW CI DEPENDENCY (AI-4): published by cargo-deny's own maintainers, and
      # cargo-deny is the tool ADR-028 §1 names. Pinned to a major tag, matching
      # how the other actions in this workflow are pinned.
      - name: Licence allowlist (cargo-deny)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: core/Cargo.toml
          # Licences only. advisories, bans, and sources stay at permissive
          # defaults and are not claimed to be enforced. [GR-8]
          command: check licenses

  rust:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # SDS §14 M0 wants multi-OS proof; this is the first automated slice.
        os: [ubuntu-latest, windows-latest, macos-latest]

    defaults:
      run:
        working-directory: core

    steps:
      - name: Checkout
        # v4 targets Node 20, which GitHub deprecated and now force-runs on
        # Node 24 while emitting a warning annotation on every job. v5 is the
        # release that moved to Node 24, so it is the smallest bump that
        # actually removes the warning. [ADR-029 §5]
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: core -> target

      - name: Install qpdf (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y qpdf
          qpdf --version

      - name: Install qpdf (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install qpdf
          qpdf --version

      - name: Install qpdf (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Direct official release zip — more reliable than choco on GHA windows runners.
          $version = "12.2.0"
          $zip = Join-Path $env:RUNNER_TEMP "qpdf.zip"
          $dest = Join-Path $env:RUNNER_TEMP "qpdf"
          $url = "https://github.com/qpdf/qpdf/releases/download/v$version/qpdf-$version-msvc64.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $dest -Force
          $qpdfExe = Get-ChildItem -Path $dest -Recurse -Filter qpdf.exe | Select-Object -First 1
          if (-not $qpdfExe) { throw "qpdf.exe not found after extract from $url" }
          $bin = $qpdfExe.Directory.FullName
          Add-Content -Path $env:GITHUB_PATH -Value $bin
          & $qpdfExe.FullName --version

      # PDFium is a setup-time input with recorded provenance, never a runtime
      # download: Z1 has no network (GR-1) and nothing transmits without an
      # explicit user action (GR-9). The step verifies the artifact against the
      # SHA-256 in third_party/pdfium/provenance.toml and fails on a mismatch.
      # [ADR-028 §1, ADR-029, SDS §13.4]
      - name: Cache provisioned engine
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: third_party/pdfium/prebuilt
          key: pdfium-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('third_party/pdfium/provenance.toml') }}

      - name: Provision PDFium
        working-directory: .
        run: |
          python tools/test_provision_engine.py
          python tools/provision_engine.py
          python tools/provision_engine.py --check

      - name: Build workspace
        run: cargo build --workspace

      - name: Test workspace
        run: cargo test --workspace

      - name: Run corpus-diff gate
        run: cargo run -q -p corpus-diff

      - name: Interop matrix (unit)
        run: cargo test -p pdf-model --test interop_matrix

      - name: Extraction correctness suite (M2)
        run: cargo test -p text-extract --test extraction_correctness

      - name: Forms JS subset + confinement + assembly ops
        run: |
          cargo test -p pdf-model forms_js
          cargo test -p pdf-model assembly_ops
          cargo test -p sandbox confinement

      - name: A11y static audit + p95 gate table
        working-directory: .
        run: |
          python tools/a11y_audit.py
          python tools/bench/check_p95_gates.py

  shell:
    name: shell (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: core -> target

      - name: Install Qt
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: 6.10.3
          cache: true

      # The tile test needs the engine the worker binds and the worker the
      # bridge spawns. Both are inputs to the M0 criterion, so both are
      # provisioned here rather than assumed. [AGENTS §11, ADR-038]
      - name: Cache provisioned engine
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: third_party/pdfium/prebuilt
          key: pdfium-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('third_party/pdfium/provenance.toml') }}

      - name: Provision PDFium
        run: python tools/provision_engine.py

      - name: Build FFI bridge and worker
        working-directory: core
        run: cargo build -p ffi-bridge -p worker-main

      - name: Locate FFI bridge
        id: ffi
        shell: pwsh
        run: |
          $path = if ($IsWindows) {
            Join-Path $env:GITHUB_WORKSPACE 'core/target/debug/ffi_bridge.lib'
          } else {
            Join-Path $env:GITHUB_WORKSPACE 'core/target/debug/libffi_bridge.a'
          }
          if (-not (Test-Path -LiteralPath $path)) { throw "Missing FFI bridge: $path" }
          "path=$path" >> $env:GITHUB_OUTPUT

      - name: Locate worker binary
        id: worker
        shell: pwsh
        run: |
          $name = if ($IsWindows) { 'worker.exe' } else { 'worker' }
          $path = Join-Path $env:GITHUB_WORKSPACE "core/target/debug/$name"
          if (-not (Test-Path -LiteralPath $path)) { throw "Missing worker binary: $path" }
          "path=$path" >> $env:GITHUB_OUTPUT

      - name: Configure shell
        run: >-
          cmake -S shell -B build/shell
          -DFFI_BRIDGE_LIB=${{ steps.ffi.outputs.path }}
          -DWORKER_BIN=${{ steps.worker.outputs.path }}
          -DPDF_PLATFORM_USE_OPENGL=OFF
          -DBUILD_TESTING=ON

      - name: Build shell
        run: cmake --build build/shell --config Release

      - name: Test shell
        run: ctest --test-dir build/shell -C Release --output-on-failure
