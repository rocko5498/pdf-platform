[package]
name        = "plugin-host"
description = "Wasmtime WASM plugin execution + Z0 control plane. [ADR-014, ADR-015]"
version.workspace = true
edition.workspace = true

[dependencies]
protocol    = { path = "../protocol" }
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
diagnostics = { path = "../diagnostics" }
wasmtime   = "28"

[dev-dependencies]
wat = "1"
