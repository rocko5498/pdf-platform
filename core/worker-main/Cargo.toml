[package]
name        = "worker-main"
description = "Z1 worker process binary. Sandboxed; hosts the engine backend. [ADR-008, SDS §2.3]"
version.workspace = true
edition.workspace = true

[[bin]]
name = "worker"
path = "src/main.rs"

[features]
# Engine backends optional — ping/echo path needs none (M0 slice 2).
default       = ["pdfium"]
pdfium        = ["dep:engine-pdfium"]

[dependencies]
engine-api    = { path = "../engine-api" }
engine-pdfium = { path = "../engine-pdfium", optional = true }
engine-stub   = { path = "../engine-stub" }
memmap2       = "0.9"
pdf-cos       = { path = "../pdf-cos" }
sandbox       = { path = "../sandbox" }
protocol      = { path = "../protocol" }
diagnostics   = { path = "../diagnostics" }
pdf-model     = { path = "../pdf-model" }
ocr-bridge    = { path = "../ocr-bridge" }
render-pipeline = { path = "../render-pipeline" }
base64        = "0.22"

[dev-dependencies]
# Integration tests link spawn + protocol + session types.
sandbox       = { path = "../sandbox" }
protocol      = { path = "../protocol" }
coordinator   = { path = "../coordinator" }
jobs          = { path = "../jobs" }
