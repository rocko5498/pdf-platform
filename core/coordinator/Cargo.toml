[package]
name        = "coordinator"
description = "DocumentCoordinator actor + global service wiring. [ADR-010, SDS §2.2]"
version.workspace = true
edition.workspace = true
license.workspace = true
[dependencies]
pdf-types       = { path = "../pdf-types" }
pdf-cos         = { path = "../pdf-cos" }
pdf-model       = { path = "../pdf-model" }
pdf-write       = { path = "../pdf-write" }
engine-api      = { path = "../engine-api" }
render-pipeline = { path = "../render-pipeline" }
text-extract    = { path = "../text-extract" }
search          = { path = "../search" }
jobs            = { path = "../jobs" }
sign            = { path = "../sign" }
ocr-bridge      = { path = "../ocr-bridge" }
plugin-host     = { path = "../plugin-host" }
sandbox         = { path = "../sandbox" }
protocol        = { path = "../protocol" }
diagnostics     = { path = "../diagnostics" }
# MIT OR Apache-2.0. Exit seam: broker::UtilityGrantRegistry::issue_at.
getrandom       = "0.4"
base64          = "0.22"

[dev-dependencies]
# Test-only: builds PDF 1.5+ fixtures (object streams, xref streams) so what is
# being parsed is visible in the test rather than checked in as a blob. Already
# in the lockfile via pdf-cos; MIT OR Apache-2.0. [ADR-028, §6]
flate2 = "1"
