[package]
name        = "sandbox"
description = "Per-OS worker confinement + WorkerTransport impls. [ADR-008, ADR-016, ADR-031]"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
enforced-confinement = []

[dependencies]
protocol    = { path = "../protocol" }
diagnostics = { path = "../diagnostics" }
# Shared tile buffers; same pin as pdf-cos (MIT). Exit: sandbox::shmem module. [ADR-028]
memmap2     = "0.9"

[target.'cfg(target_os = "linux")'.dependencies]
# seccomp-bpf + namespace setup; deps added at M0 implementation
[target.'cfg(target_os = "windows")'.dependencies]
# Named pipe FFI is declared inline via #[link(name = "kernel32")] — no
# windows-sys dependency needed. Consistent with spawn.rs SetHandleInformation.
[target.'cfg(target_os = "macos")'.dependencies]
# Sandbox profile setup; deps added at M0 implementation
