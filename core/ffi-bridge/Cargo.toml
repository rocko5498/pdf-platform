[package]
name        = "ffi-bridge"
description = "Sole Rust↔Qt FFI boundary. cxx-generated bridge. [ADR-004, ADR-025]"
version.workspace = true
edition.workspace = true
build = "build.rs"

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
coordinator = { path = "../coordinator" }
protocol    = { path = "../protocol" }
sandbox     = { path = "../sandbox" }
engine-stub = { path = "../engine-stub" }
pdf-model   = { path = "../pdf-model" }
pdf-write   = { path = "../pdf-write" }
engine-api  = { path = "../engine-api" }
search      = { path = "../search" }
cxx         = "1"

[build-dependencies]
cxx-build = "1"
